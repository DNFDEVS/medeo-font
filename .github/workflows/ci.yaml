name: Build and check

# Every pull request and every push to main or a release branch: build the fonts from sources/, require the committed fonts/ to equal
# the fresh build (what the repository holds is what a release publishes), then Font Bakery's googlefonts profile
# and the language list check (make test).
on:
  pull_request:
  push:
    branches: [main, "release/**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fonts:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fresh build equals the committed fonts
        run: make check
      - name: Font Bakery and languages
        run: make test
      - name: Record build dependencies
        if: always()
        run: |
          mkdir -p out
          if [ -x venv/bin/python ]; then
            venv/bin/python -m pip freeze > out/build-dependencies.txt
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fonts-and-reports
          path: |
            out/build/fonts/
            out/build-dependencies.txt
            out/fontbakery-*.json
