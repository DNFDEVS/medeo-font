name: Release

# A tag vX.Y.Z[-rc.N] publishes a GitHub release of that commit. Its one asset, Medeo-vX.Y.Z.zip, holds exactly
# the committed files of the tagged commit that people install and read:
#   fonts/ (every family, with the Nerd Fonts icon licences), OFL.txt, AUTHORS.txt, CONTRIBUTORS.txt,
#   README.md, CHANGELOG.md, FONTLOG.txt, LANGUAGES.md.
# Nothing is rebuilt here and nothing outside that list enters the ZIP. The release notes are the version's
# dated section of CHANGELOG.md. This workflow does not publish npm: see npm.yaml.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write  # the GitHub release

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: fontTools
        run: python -m pip install -q "fonttools==4.60.1"
      - name: Version from the tag
        run: |
          mkdir -p out
          version="${GITHUB_REF_NAME#v}"
          printf '{"version": "%s"}\n' "$version" > out/version.json
      - name: Tag and the version inside every font agree
        run: python -I scripts/release_version.py "$GITHUB_REF_NAME" out/version.json fonts
      - name: Release notes from CHANGELOG.md
        # a version without its dated CHANGELOG section stops here, before anything is published
        run: python -I scripts/release_notes.py out/version.json CHANGELOG.md > out/release-body.md
      - name: ZIP of the tagged commit's files
        run: |
          zip="Medeo-$GITHUB_REF_NAME.zip"
          git ls-files -z -- fonts OFL.txt AUTHORS.txt CONTRIBUTORS.txt README.md CHANGELOG.md FONTLOG.txt LANGUAGES.md \
            | xargs -0 zip -q -X "out/$zip"
          # the ZIP holds exactly those committed files, byte for byte
          git ls-files -- fonts OFL.txt AUTHORS.txt CONTRIBUTORS.txt README.md CHANGELOG.md FONTLOG.txt LANGUAGES.md \
            | sort > out/expected.txt
          zipinfo -1 "out/$zip" | sort > out/zipped.txt
          diff out/expected.txt out/zipped.txt
          mkdir -p out/unzipped && unzip -q "out/$zip" -d out/unzipped
          while IFS= read -r f; do cmp "$f" "out/unzipped/$f"; done < out/expected.txt
          echo "ZIP=out/$zip" >> "$GITHUB_ENV"
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case $GITHUB_REF_NAME in *-*) pre=--prerelease ;; *) pre= ;; esac
          gh release create "$GITHUB_REF_NAME" "$ZIP" --verify-tag --title "Medeo $GITHUB_REF_NAME" \
            --notes-file out/release-body.md $pre
