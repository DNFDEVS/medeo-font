# The configuration for the builder is in YAML format. You can use
# https://www.yamllint.com/ to make sure that your configuration
# file is correctly formatted.

# First we need to define the source files to build. Please list
# all sources in the same family. These are expected to be in the
# sources/ directory, so all paths should be relative to that
# directory.
sources:
  - MedeoSans.glyphspackage
  - MedeoSans-Italic.glyphspackage
outputDir: ../fonts/MedeoSans
familyName: "Medeo Sans"
cleanUp: true

# Next you can supply alternative paths for where you want the
# binaries to live. But we'd recommend you stick to the defaults
# especially if you are planning to upload your font to Google Fonts.

# outputDir: ../fonts
# vfDir: $outputDir/variable
# ttDir: $outputDir/ttf
# otDir: $outputDir/otf
# woffDir: $outputDir/webfonts

# The following entries, which are either "true" or "false"
# determine which targets to build. We turn off OTFs for this demo.

# buildVariable: true
# Static TTFs, one per named instance of the sources, for apps that cannot open variable fonts. The named
# instances sit at opsz 14, the text size and the variable font's default, so the statics are the text cut;
# Display stays in the variable font.
# TTF only, hinted by ttfautohint: it opens wherever an OTF does, and OTF hinting needs otfautohint, which the pinned
# tools do not include. No static web fonts: the web uses the variable WOFF2 (scripts/webfonts.py).
buildStatic: true
# Merge component joins before hinting so static outlines support strokes and print export.
extraStaticFontmakeArgs: "--filter DecomposeComponentsFilter"
buildWebfont: false
# buildTTF: true
buildOTF: false
# buildSmallCap: false

# The next flags control autohinting.
# autohintTTF: true
autohintOTF: true
# ttfaUseScript: false  # Set this to true if your font is not Latin

# The "fix" operation can optionally fix some problems which
# are better dealt with in the font sources. Set this to true if you
# want gftools-fix to automatically fix source problems.
# includeSourceFixes: false

# These options give fine-grained control over how fontmake builds
# the fonts.
# flattenComponents: true
# decomposeTransformedComponents: true
# checkCompatibility: true
# overlaps: booleanOperations
# expandFeaturesToInstances: false
# reverseOutlineDirection: true
# removeOutlineOverlaps: true
# extraFontmakeArgs: ""
# extraVariableFontmakeArgs: ""
# extraStaticFontmakeArgs: ""
# glyphData: GlyphData.xml

# This control how STAT tables are generated. The STAT table is
# specified here as a list of axis names, tags and values. You
# can either map a list to each output VF, or provide a single
# list which is used for all VFs. Note that the build will fail
# if you specify a dictionary which does not contain an entry
# for each VF file built.
# The optical size values are the Google Fonts axis registry's (opsz 14 elidable, 32 unnamed, as Inter on
# Google Fonts); ital stays the last axis (fontspector opentype/STAT/ital_axis).
stat:
  MedeoSans[opsz,wght].ttf:
  - name: Weight
    tag: wght
    values:
    - name: Thin
      value: 100
    - name: ExtraLight
      value: 200
    - name: Light
      value: 300
    - name: Regular
      value: 400
      linkedValue: 700
      flags: 2
    - name: Medium
      value: 500
    - name: SemiBold
      value: 600
    - name: Bold
      value: 700
    - name: ExtraBold
      value: 800
    - name: Black
      value: 900
  - name: Optical size
    tag: opsz
    values:
    - name: 14pt
      value: 14
      flags: 2
    - name: 16pt
      value: 16
    - name: 17pt
      value: 17
    - name: 18pt
      value: 18
    - name: 20pt
      value: 20
    - name: 24pt
      value: 24
    - name: 28pt
      value: 28
  - name: Italic
    tag: ital
    values:
    - name: Roman
      value: 0
      linkedValue: 1
      flags: 2
  MedeoSans-Italic[opsz,wght].ttf:
  - name: Weight
    tag: wght
    values:
    - name: Thin
      value: 100
    - name: ExtraLight
      value: 200
    - name: Light
      value: 300
    - name: Regular
      value: 400
      linkedValue: 700
      flags: 2
    - name: Medium
      value: 500
    - name: SemiBold
      value: 600
    - name: Bold
      value: 700
    - name: ExtraBold
      value: 800
    - name: Black
      value: 900
  - name: Optical size
    tag: opsz
    values:
    - name: 14pt
      value: 14
      flags: 2
    - name: 16pt
      value: 16
    - name: 17pt
      value: 17
    - name: 18pt
      value: 18
    - name: 20pt
      value: 20
    - name: 24pt
      value: 24
    - name: 28pt
      value: 28
  - name: Italic
    tag: ital
    values:
    - name: Italic
      value: 1
